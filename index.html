<script>

const IC={home:'<path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-7h6v7"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18.5 14.5c1.8.8 3 2.6 3 5.5"/>',music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',bike:'<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1.2-1.3-2-3-2s-3 .8-3 2c0 3 6 1.5 6 4.5 0 1.2-1.3 2-3 2s-3-.8-3-2"/>',book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5z"/><path d="M8 8h7M8 12h7"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',sliders:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/>',
play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',pause:'<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>',prev:'<path d="M18 5v14L8 12z" fill="currentColor" stroke="none"/><path d="M6 5v14"/>',next:'<path d="M6 5v14l10-7z" fill="currentColor" stroke="none"/><path d="M18 5v14"/>',shuffle:'<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',vol:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',
plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',check:'<path d="M5 12l5 5 10-10"/>',power:'<path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0"/>',chev:'<path d="M9 6l6 6-6 6"/>',
crown:'<path d="M3 7l4 4 5-7 5 7 4-4-2 11H5z"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',wrench:'<path d="M14.7 6.3a4 4 0 0 0 5 5L11 20a2.1 2.1 0 0 1-3-3z"/>'};
IC.unlink='<path d="m18.84 12.25 1.72-1.71a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="m5.17 11.75-1.71 1.71a5 5 0 0 0 7.07 7.07l1.71-1.71"/><path d="M8 2v3M2 8h3M16 19v3M19 16h3"/>';
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||IC.star}</svg>`;
const GI=[['crown','Couronne'],['star','Étoile'],['shield','Bouclier'],['flag','Drapeau'],['key','Clé'],['flame','Flamme'],['bolt','Éclair'],['wrench','Outil'],['bike','Moto']];
const COLS=['members','grades','vehicles','vault','vlog','lockers','debts','compta','playlist','users','settings'];
const S={};COLS.forEach(c=>S[c]=[]);
let uid=null,token=null,online=new Set(),timer=0,V='accueil',SUB=null,TAB=0,lastKey='';
try{uid=localStorage.getItem('sn_uid');token=localStorage.getItem('sn_tok')}catch(e){}
if(!/^[a-f0-9]{32}$/.test(uid||'')||!/^[a-f0-9]{32}$/.test(token||'')){const R=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');uid=R();token=R();try{localStorage.setItem('sn_uid',uid);localStorage.setItem('sn_tok',token)}catch(e){}}
const site=()=>S.settings.find(x=>x.id==='site')||{};
const restr=()=>!!uid&&!isP()&&!(meU()&&meU().memberId);
const isP=()=>!!uid&&site().president===uid;
const meU=()=>S.users.find(u=>u.id===uid);
const mem=id=>S.members.find(m=>m.id===id);
const grade=id=>S.grades.find(g=>g.id===id);
const meM=()=>mem(meU()?.memberId);
const mine=m=>m&&meM()&&m.id===meM().id;
const fmt=t=>t?new Date(t).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'';
const mname=m=>m?(m.surnom||((m.prenom||'')+' '+(m.nom||'')).trim()||'Sans nom'):'Inconnu';
const uname=u=>{const m=mem(u.memberId);return m?mname(m):(u.id===site().president?'Président':(u.num?'Arrivant '+u.num:(u.name||'Arrivant(e)')))};
const who=()=>{const m=meM();return m?mname(m):(meU()?.name||'Arrivant(e)')};
let tt=0;const toast=(m,ms=3200)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms)};
const run=async f=>{try{await f()}catch(e){toast('Erreur : '+(e.message||e.code||e))}};
const C=n=>({add:d=>w('add',n,null,d),doc:id=>({set:d=>w('set',n,id,d),update:d=>w('update',n,id,d),delete:()=>w('delete',n,id)})});
const add=(n,d)=>run(()=>C(n).add({...d,at:Date.now()}));
const upd=(n,id,d)=>run(()=>C(n).doc(id).update(d));
const del=(n,id)=>run(()=>C(n).doc(id).delete());
const setSite=d=>{const{id,...r}=site();return run(()=>C('settings').doc('site').set({...r,...d}))};
const sched=()=>{clearTimeout(timer);timer=setTimeout(renderAll,60)};
const av=(m,u,sz=44)=>{const p=m&&m.photo,st=`width:${sz}px;height:${sz}px;font-size:${sz*.4}px`;return okImg(p)?`<img class=av style="${st}" src="${E(p)}" alt="">`:`<div class=av style="${st}">${u&&!m&&u.num?u.num:E(((m?mname(m):(u&&u.id===site().president?'Président':u?.name))||'?')[0]).toUpperCase()}</div>`};
const gi=g=>ic(g?g.icon:'star',14);
const pill=(t,c='',i='')=>`<span class="pill ${c}">${i}${E(t)}</span>`;
const rnd32=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
const shrink=(f,max=220)=>new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.78))};im.onerror=()=>ko(new Error('x'));im.src=u});
/* musique : fichiers envoyés au serveur par morceaux */
async function upAud(f,title){if(f.size>12*1024*1024)return toast('Fichier trop lourd (12 Mo maximum).');const aid=rnd32(),CH=524288,n=Math.max(1,Math.ceil(f.size/CH));
 try{for(let i=0;i<n;i++){toast(`Envoi de « ${title} » : ${Math.round(i/n*100)} %`,60000);const u=new Uint8Array(await f.slice(i*CH,(i+1)*CH).arrayBuffer());let s='';for(let k=0;k<u.length;k+=8192)s+=String.fromCharCode.apply(null,u.subarray(k,k+8192));await post({a:'aup',aid,i,n,size:f.size,type:f.type,data:btoa(s)})}
  await C('playlist').add({title,url:'/api/audio?id='+aid});toast('Titre ajouté à la playlist.')}
 catch(e){toast('Envoi impossible : '+(e.message||e),6000)}}
function form(title,fields,cb,okTxt='Valider'){const m=$('#modal');
 m.innerHTML=`<form class=box><h3>${E(title)}</h3>${fields.map(f=>f.t==='msg'?`<p class=mu>${E(f.l)}</p>`:`<label>${E(f.l)}${f.t==='area'?`<textarea name="${f.k}" style="min-height:${f.h||84}px">${E(f.v)}</textarea>`:f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${E(o[0])}"${o[0]==f.v?' selected':''}>${E(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t==='num'?'number':'text'}" ${f.t==='num'?'step=any min=0':''} value="${E(f.v)}">${f.t==='img'||f.t==='aud'?`<input type=file data-f="${f.k}" accept="${f.t==='img'?'image/*':'audio/*'}">`:''}`}</label>`).join('')}<div class=act><button type=button class=ghost data-a=close>Annuler</button><button class=btn>${okTxt}</button></div></form>`;
 m.classList.add('on');const fm=m.firstChild;
 fm.onsubmit=async e=>{e.preventDefault();const o={};new FormData(fm).forEach((v,k)=>{if(typeof v==='string')o[k]=v.trim()});
  for(const fi of fm.querySelectorAll('input[type=file]')){const f=fi.files[0];if(!f)continue;if(fi.accept.startsWith('audio')){o[fi.dataset.f+'_file']=f;continue}try{o[fi.dataset.f]=await shrink(f)}catch(x){toast('Image illisible.');return}}
  m.classList.remove('on');await cb(o)}}
/* ---------- lecteur ---------- */
const au=new Audio();let ti=0,defUrl=null,shuf=false,rep=false;
const tracks=()=>[{id:'default',title:'American Idiot',art:'Green Day',def:1,src:'/music/american-idiot.mp3'},...S.playlist.map(p=>({id:p.id,title:p.title,art:'Playlist du club',src:p.url}))];
const tm=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const fill=e=>e.style.setProperty('--v',(e.value/e.max*100)+'%');
function now(){const k=tracks()[ti]||tracks()[0];$('#ti').textContent=au.src?k.title:'Playlist du club';$('#ar').textContent=au.src?k.art:'Appuie sur lecture';$('#pp').innerHTML=ic(au.paused?'play':'pause',20);$('#sh').className=shuf?'on':'';$('#rp').className=rep?'on':''}
function load(i,play){const t=tracks();ti=(i+t.length)%t.length;const k=t[ti];au.src=k.src;now();if(play)au.play().catch(()=>toast('Lecture impossible pour ce titre.'));if(V==='musique')sched()}
function nextT(){const n=tracks().length;load(shuf&&n>1?(ti+1+Math.floor(Math.random()*(n-1)))%n:ti+1,true)}
$('#pp').onclick=()=>{if(!au.src)load(ti,true);else au.paused?au.play().catch(()=>toast('Lecture impossible.')):au.pause()};
$('#pv').onclick=()=>load(ti-1,true);$('#nx').onclick=nextT;$('#sh').onclick=()=>{shuf=!shuf;now()};$('#rp').onclick=()=>{rep=!rep;now()};
au.onended=()=>{if(rep){au.currentTime=0;au.play()}else nextT()};au.onerror=()=>{if(au.src){toast('Titre illisible, passage au suivant.');if(tracks().length>1)setTimeout(nextT,600)}};
au.onplay=au.onpause=now;
au.ontimeupdate=()=>{const p=$('#pr');if(au.duration){p.value=au.currentTime/au.duration*1000;fill(p)}$('#t1').textContent=tm(au.currentTime);$('#t2').textContent=tm(au.duration)};
$('#pr').oninput=e=>{fill(e.target);if(au.duration)au.currentTime=e.target.value/1000*au.duration};
au.volume=.7;$('#vo').oninput=e=>{fill(e.target);au.volume=e.target.value/100};
['sh','pv','nx','rp'].forEach(k=>$('#'+k).innerHTML=ic({sh:'shuffle',pv:'prev',nx:'next',rp:'repeat'}[k],k==='sh'||k==='rp'?17:20));
$('#vi').innerHTML=ic('vol',18);$('#cv').innerHTML=ic('music',24);fill($('#vo'));fill($('#pr'));now();
/* ---------- navigation ---------- */
const NAV=[['Club',[['accueil','Accueil','home','#1fbf8a'],['membres','Membres','users','#4aa3ff'],['musique','Musique','music','#ff6fae']]],['Logistique',[['vehicules','Véhicules','bike','#f5c542'],['coffre','Coffre','box','#e0a050'],['casiers','Casiers','lock','#ff7a6b'],['rembourser','À rembourser','coin','#f5c542'],['compta','Comptabilité','book','#3fd6c0']]],['Gestion',[['grades','Grades','shield','#f5c542'],['params','Paramètres','sliders','#4aa3ff']]]];
const flat=NAV.flatMap(x=>x[1]);
const logo=(s,z=42)=>okImg(s.logo)?`<img class=logo style="width:${z}px;height:${z}px" src="${E(s.logo)}" alt="">`:`<div class=logo style="width:${z}px;height:${z}px">${ic('bike',z*.55)}</div>`;
function renderNav(){const s=site(),P=isP(),RS=restr();$('#nav').innerHTML='<div class=sc>'+`<div class=brand>${logo(s)}<div><b>${E(s.name||'SOUTHERNERS')}</b><small>Motor Club</small></div></div>`+NAV.map(([h,l],ci)=>{const it=l.filter(x=>RS?x[0]==='accueil':(x[0]!=='params'||P));return !it.length?'':`<h6>${h}</h6>`+it.map(([id,t,i,c])=>`<button class="nv c${ci}${V===id?' on':''}" data-a=go data-id="${id}"><span class=ni style="color:${c}">${ic(i,19)}</span>${t}</button>`).join('')}).join('')+`<div class=navfoot>${isP()?'':`<button class="ghost sm" data-a=acc>${ic('key',14)}Accès gestion</button>`}<button class="ghost sm" data-a=me>${ic('users',14)}Mon accès</button></div></div>`;document.title=(s.name||'SOUTHERNERS')+' — Club'}
const tabsH=l=>`<div class=tabs>${l.map((t,i)=>`<button class="tab${i===TAB?' on':''}" data-a=tab data-id="${i}">${t}</button>`).join('')}</div>`;
const BC={addM:'bl',addV:'yl',addT:'pk',addL:'rd',addD:'rd',addC:'bl',addG:'yl'};
const addB=(a,t,id='')=>`<button class="btn ${BC[a]||''}" data-a="${a}" data-id="${id}">${ic('plus',16)}${t}</button>`;
const person=(m,sub,i)=>`<button class="tile pc" data-a=go data-id="${V}" data-i="${m.id}">${av(m,null,64)}<b>${E(mname(m))}</b><small class=mu>${sub}</small></button>`;
const emptyH=t=>`<div class=empty>${t}</div>`;
const WELCOME=()=>`<div class=wb><span class=wi>${ic('key',22)}</span><div><h3>Bienvenue aux arrivant(e)s</h3><p>Pose ta machine, installe-toi au comptoir et sers-toi une tasse de thé… ou quelque chose de plus fort. Ici, la maison ne s’ouvre pas en grand au premier venu : tant que nous ne connaissons pas ton histoire, certaines portes restent closes. Ce n’est pas de la méfiance, c’est de la prudence, pour protéger la famille de ceux qui franchissent le seuil avec de mauvaises intentions.</p><p>Patiente, fais-toi connaître, et quand un frère aura répondu de toi, tout s’ouvrira.</p><p>Ton numéro d’arrivant s’affiche dans la bulle ronde en bas à droite : donne-le au président, c’est lui qui t’ouvrira les portes.</p></div></div>`;
const LORE_DEF=`# Notre histoire
Les Southerners sont nés au bord d'une route poussiéreuse du sud de San Andreas, autour de trois motos, d'un garage prêté et d'une promesse : ne jamais laisser un frère rouler seul. Ce qui n'était qu'une bande de passionnés est devenu une famille.

# Le Code
Le respect avant tout. On ne vend pas un frère, on ne touche pas à ce qui appartient au club, on paie ses dettes. Ce qui se dit au bar reste au bar, et la parole d'un Southerner vaut plus qu'un contrat.

# Nos terres
Un garage qui sent l'huile et le cuir, un bar où la musique ne s'arrête jamais, et des routes à perte de vue. Ici, on partage un bon verre, un bon cigare et de bonnes histoires, sans oublier d'où l'on vient.

# Rejoindre la famille
On n'entre pas chez les Southerners, on y est accueilli. Fais-toi connaître, lie ton compte à la fiche de ton personnage, et gagne ta place un kilomètre à la fois.`;
function parseLore(x){const ch=[],intro=[];let c=null;String(x).split('\n').forEach(l=>{l=l.trim();if(l.startsWith('# ')){c={h:l.slice(2),p:[]};ch.push(c)}else if(l)(c?c.p:intro).push(l)});return{ch,intro}}
function vAccueil(){const s=site(),{ch,intro}=parseLore(s.lore||LORE_DEF),ics=['flag','shield','key','bike','flame','star'];
 return `<div class=hero><span class="pill em" style="position:relative;margin-bottom:16px">${ic('bike',13)}Motor Club — Los Santos</span><h1>${E(s.title||s.name||'SOUTHERNERS')}</h1><p>${E(s.text||'Bienvenue chez les Southerners. Installe-toi, sers-toi un verre et prends le temps de découvrir qui nous sommes.')}</p></div>${restr()?WELCOME():''}<div class=lore>${intro.map(p=>`<p class=lead>${E(p)}</p>`).join('')}${ch.map((c,i)=>`<article class=ch><span class=n>${ic(ics[i%ics.length],20)}</span><div><h3>${E(c.h)}</h3>${c.p.map(p=>`<p>${E(p)}</p>`).join('')}</div></article>`).join('')}</div>`}
function vMembres(){const P=isP();
 if(SUB){const m=mem(SUB);if(!m)return emptyH('Fiche introuvable.');const g=grade(m.gradeId),u=S.users.find(x=>x.id===m.uid);
  return `<div class=prof><div class=banner></div><div class=pb>${av(m,null,92)}<h2>${E(m.prenom)} ${E(m.nom)}</h2><div class=mu>${m.surnom?'« '+E(m.surnom)+' »':'Pas de surnom'}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${pill(g?g.name:'Sans grade','em',g?gi(g):'')}${pill(m.statut||'Statut non défini','bl')}${u?pill(online.has(u.id)?'En ligne':'Hors ligne',''):pill('Compte non lié','')}${u&&u.duty?pill('En service','em',ic('power',13)):''}</div>
  <div class=bubs><div class=bub><span>Téléphone</span><b>${E(m.tel)||'Non renseigné'}</b></div><div class=bub><span>Prénom</span><b>${E(m.prenom)||'—'}</b></div><div class=bub><span>Nom</span><b>${E(m.nom)||'—'}</b></div></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">${/^https?:\/\//.test(m.bg||'')?`<a class=btn href="${E(m.bg)}" target=_blank rel=noopener style="text-decoration:none">${ic('link',16)}Background du personnage</a>`:''}${P||mine(m)?`<button class=btn data-a=editM data-id="${m.id}">${ic('edit',16)}Modifier</button>`:''}${P?`<button class="ghost" data-a=delM data-id="${m.id}">${ic('trash',16)}Supprimer</button>`:''}${P?(m.uid?`<button class=ghost data-a=unlink data-id="${m.uid}">${ic('unlink',16)}Remettre en arrivant</button>`:`<button class=ghost data-a=relinkM data-id="${m.id}">${ic('link',16)}Relier à un compte</button>`):''}</div></div></div>`}
